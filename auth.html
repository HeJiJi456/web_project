<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека - Авторизация</title>
    <style>
        /* Базовые стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Белая карточка авторизации */
        .auth-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .auth-card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #1f2937;
            font-weight: 600;
        }

        /* Баннер для вывода ошибок валидации */
        .error-message {
            background-color: #fca5a5;
            color: #7f1d1d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
            display: none; /* скрыт по умолчанию */
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #4b5563;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background-color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 1px #2563eb;
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: row-reverse;
            margin-top: 24px;
        }

        .login-link {
            color: #1d4ed8;
            font-size: 14px;
            text-decoration: underline;
            cursor: pointer;
        }

        .btn-blue {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-blue:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Блок для вывода ошибки, если пароль или email неверные -->
        <div id="error-banner" class="error-message"></div>

        <h2>Авторизация</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="auth-email" required autofocus>
            </div>
            
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="auth-password" required>
            </div>
            
            <div class="form-footer">
                <button type="submit" class="btn-blue">Войти</button>
                <a class="login-link" href="register.html">Создать аккаунт</a>
            </div>
        </form>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ -->
    <script src="db.js"></script>
    <script src="auth.js"></script>

</body>
</html>
